<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix SPA - daisyUI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Scrollbar Styling */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: oklch(var(--bc) / 0.2); border-radius: 10px; }
        .custom-scroll:hover::-webkit-scrollbar-thumb { background-color: oklch(var(--bc) / 0.4); }

        /* Drag and Drop Styling */
        .dragging { opacity: 0.4; transform: scale(0.98); cursor: grabbing !important; }
        .drag-over { position: relative; background-color: oklch(var(--p) / 0.05) !important; }
        .drag-over::after {
            content: ''; position: absolute; inset: 4px;
            border: 2px dashed oklch(var(--p)); border-radius: var(--rounded-box);
            pointer-events: none; z-index: 50;
        }
        
        [contenteditable="true"] { cursor: text; }
        
        /* Theme Toggle Icon Logic */
        [data-theme="dark"] .dark-hidden { display: none; }
        [data-theme="light"] .dark-block { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-base-200 antialiased selection:bg-primary selection:text-primary-content">

    <header class="navbar bg-base-100 border-b border-base-300 px-6 shrink-0 z-20 shadow-sm transition-colors">
        <div class="flex-1 gap-4">
            <div class="bg-primary text-primary-content p-2 rounded-box shadow-sm">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-base-content leading-none">Eisenhower Matrix</h1>
                <p class="text-[10px] text-base-content/50 font-bold uppercase tracking-widest mt-1">Productivity Hub</p>
            </div>
        </div>
        
        <div class="flex-none gap-2 items-center">
            <button data-action="export-json" class="btn btn-ghost btn-sm text-[11px] font-bold uppercase tracking-wider text-base-content/60" title="Export Data">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
            </button>
            <label class="btn btn-ghost btn-sm text-[11px] font-bold uppercase tracking-wider text-base-content/60 cursor-pointer" title="Import Data">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import
                <input type="file" id="import-input" accept=".json" class="hidden">
            </label>
            
            <div class="divider divider-horizontal mx-0"></div>

            <button id="theme-toggle" class="btn btn-circle btn-ghost btn-sm text-base-content/70" title="Toggle Theme">
                <i data-lucide="moon" class="w-4 h-4 dark-hidden"></i>
                <i data-lucide="sun" class="w-4 h-4 dark-block"></i>
            </button>
            
            <div class="badge badge-neutral badge-outline shadow-sm py-3 px-4 font-bold border-base-300 ml-2">
                <span id="task-count" class="text-primary mr-1">0</span> Tasks
            </div>
        </div>
    </header>

    <div id="app" class="flex-1 flex overflow-hidden relative"></div>

    <script>
        const STORAGE_KEY = 'eisenhower_matrix_daisy_state';

        // --- 1. STATE MANAGEMENT ---
        const defaultState = {
            tasks: [
                { id: '1', text: 'Review quarterly goals and objectives', location: 'q1', completed: false, created: Date.now(), completedAt: null, isHighlighted: true, dueDate: null },
                { id: '2', text: 'Weekly sync with the engineering team', location: 'inbox', completed: false, created: Date.now(), completedAt: null, isHighlighted: false, dueDate: null },
            ],
            notes: "Quick scratchpad for thoughts...",
            quadrants: {
                q1: { title: 'Do First', subtitle: 'Urgent & Important' },
                q2: { title: 'Schedule', subtitle: 'Not Urgent & Important' },
                q3: { title: 'Delegate', subtitle: 'Urgent & Not Important' },
                q4: { title: 'Don\'t Do', subtitle: 'Not Urgent & Not Important' }
            },
            isDarkMode: false,
            draggedTaskId: null,
            editingId: null,
            datePickingId: null,
            showClearModal: false
        };

        const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const state = savedState ? { ...defaultState, ...savedState, draggedTaskId: null, editingId: null, datePickingId: null, showClearModal: false } : defaultState;

        const QUADRANT_STYLE = {
            q1: { border: 'border-t-error', text: 'text-error', bg: 'bg-error/5' },
            q2: { border: 'border-t-info', text: 'text-info', bg: 'bg-info/5' },
            q3: { border: 'border-t-success', text: 'text-success', bg: 'bg-success/5' },
            q4: { border: 'border-t-neutral', text: 'text-neutral', bg: 'bg-neutral/5' }
        };

        function updateState(updates) {
            Object.assign(state, updates);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render();
        }

        // --- 2. HELPERS ---
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('[draggable="true"]:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                }
                return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}`;
        }

        function exportToJSON() {
            const cleanState = { ...state };
            delete cleanState.draggedTaskId; delete cleanState.editingId; delete cleanState.datePickingId; delete cleanState.showClearModal;
            const blob = new Blob([JSON.stringify(cleanState, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const linkElement = document.createElement('a');
            linkElement.href = url;
            linkElement.download = `eisenhower-matrix-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(linkElement);
            linkElement.click();
            document.body.removeChild(linkElement);
            URL.revokeObjectURL(url);
        }

        function importFromJSON(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState.tasks && Array.isArray(importedState.tasks)) {
                        updateState({ ...importedState, draggedTaskId: null, editingId: null, datePickingId: null, showClearModal: false });
                    }
                } catch (err) { alert("Invalid JSON file provided."); }
            };
            reader.readAsText(file);
        }

        // --- 3. COMPONENT FUNCTIONS ---
        
        function ClearHistoryModal() {
            return `
                <dialog class="modal modal-open modal-bottom sm:modal-middle backdrop-blur-sm bg-base-300/60 z-50">
                    <div class="modal-box text-center">
                        <div class="w-16 h-16 bg-error/10 text-error rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="trash-2" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-bold text-lg">Clear History?</h3>
                        <p class="py-4 text-base-content/70 text-sm">This will permanently delete all completed tasks. This action cannot be undone.</p>
                        <div class="modal-action justify-center gap-3">
                            <button class="btn btn-error text-error-content w-1/3" data-action="confirm-clear">Clear All</button>
                            <button class="btn btn-ghost w-1/3" data-action="cancel-clear">Cancel</button>
                        </div>
                    </div>
                </dialog>
            `;
        }

        function TaskItem(task) {
            const isEditing = state.editingId === task.id;
            const isPickingDate = state.datePickingId === task.id;
            
            let cardClasses = "card bg-base-100 shadow-sm border mb-3 transition-all group ";
            cardClasses += isEditing ? "ring-2 ring-primary border-primary z-10 " : "border-base-300 hover:border-base-content/20 ";
            cardClasses += (task.isHighlighted && !isEditing) ? "bg-warning/10 border-warning/30" : "";

            return `
                <div class="${cardClasses}" draggable="${!(isEditing || isPickingDate)}" data-id="${task.id}">
                    <div class="card-body p-3 flex-row items-start gap-1">
                        
                        <div class="mt-1 opacity-0 group-hover:opacity-30 cursor-grab active:cursor-grabbing px-0.5">
                            <i data-lucide="grip-vertical" class="w-4 h-4 text-base-content"></i>
                        </div>

                        <button class="mt-[4px] mr-1 text-base-content/20 hover:text-success transition-colors" data-action="complete" data-id="${task.id}" title="Complete" ${isEditing ? 'disabled style="opacity:0.2"' : ''}>
                            <i data-lucide="circle" class="w-5 h-5"></i>
                        </button>

                        <div class="flex-1 min-w-0 pr-1">
                            <span 
                                class="text-sm font-semibold leading-relaxed text-base-content outline-none block break-words py-0.5 ${isEditing ? 'input input-bordered input-sm input-primary w-full' : ''}"
                                contenteditable="${isEditing}" data-type="task-text" data-id="${task.id}"
                            >${task.text}</span>
                            
                            ${task.dueDate ? `<div class="badge badge-primary badge-outline badge-sm mt-2 font-bold gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${task.dueDate.split('-').reverse().join('.')}</div>` : ''}
                            
                            ${(isEditing || isPickingDate) ? `
                                <div class="mt-3 pt-3 border-t border-base-200 flex flex-col gap-2">
                                    <div class="flex items-center justify-between">
                                        <label class="text-[9px] uppercase font-bold text-base-content/50 tracking-wider">Due Date</label>
                                        ${isPickingDate && !isEditing ? `<button class="btn btn-ghost btn-xs text-primary" data-action="close-date">Done</button>` : ''}
                                    </div>
                                    <input type="date" class="input input-bordered input-sm w-full" value="${task.dueDate || ''}" data-type="task-due-date" data-id="${task.id}">
                                </div>
                            ` : ''}
                        </div>

                        <div class="flex items-center gap-0.5 mt-0.5 transition-opacity ${isEditing || isPickingDate ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}">
                            <button class="btn btn-square btn-xs btn-ghost ${task.isHighlighted ? 'text-warning opacity-100' : 'text-base-content/40 hover:text-warning'}" data-action="highlight" data-id="${task.id}">
                                <i data-lucide="star" class="w-3.5 h-3.5 ${task.isHighlighted ? 'fill-current' : ''}"></i>
                            </button>
                            <button class="btn btn-square btn-xs ${isEditing ? 'btn-primary' : 'btn-ghost text-base-content/40 hover:text-primary'}" data-action="edit" data-id="${task.id}">
                                <i data-lucide="${isEditing ? 'check' : 'pencil'}" class="w-3.5 h-3.5"></i>
                            </button>
                            <button class="btn btn-square btn-xs ${isPickingDate ? 'btn-secondary text-secondary-content' : 'btn-ghost text-base-content/40 hover:text-secondary'}" data-action="toggle-date-picker" data-id="${task.id}">
                                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                            </button>
                            ${!(isEditing || isPickingDate) ? `<button class="btn btn-square btn-xs btn-ghost text-base-content/40 hover:text-error" data-action="delete" data-id="${task.id}"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                        </div>
                        
                        ${task.isHighlighted && !isEditing && !isPickingDate ? `
                            <div class="absolute right-1 top-1 p-1 text-warning group-hover:hidden"><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i></div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function CompletedTaskItem(task) {
            const dateStr = task.completedAt ? formatDate(task.completedAt) : '';
            return `
                <div class="card bg-base-100 border border-base-300 shadow-sm shrink-0 w-64 mr-3 relative group overflow-visible">
                    <div class="card-body p-3 flex-row items-start gap-3">
                        <div class="mt-0.5 text-success shrink-0"><i data-lucide="check-circle-2" class="w-4 h-4"></i></div>
                        <div class="min-w-0 flex-1">
                            <span class="text-xs font-medium text-base-content/50 line-through block truncate">${task.text}</span>
                            ${dateStr ? `<div class="text-[9px] text-base-content/40 font-bold mt-1">${dateStr}</div>` : ''}
                        </div>
                        <button class="btn btn-circle btn-xs absolute -top-2 -right-2 bg-base-200 border border-base-300 text-base-content/50 hover:text-primary hover:border-primary opacity-0 group-hover:opacity-100 shadow-sm" data-action="restore" data-id="${task.id}" title="Restore Task">
                            <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function LeftPanel() {
            const inboxTasks = state.tasks.filter(t => t.location === 'inbox' && !t.completed);
            return `
                <div class="w-[320px] min-w-[320px] bg-base-100 border-r border-base-300 flex flex-col h-full z-10">
                    <div class="flex flex-col h-3/5 border-b border-base-300 relative">
                        <div class="p-5 pb-2 flex items-center gap-2">
                            <h2 class="text-base font-bold text-base-content">Inbox</h2>
                            <div class="badge badge-neutral badge-sm font-bold">${inboxTasks.length}</div>
                        </div>
                        <div class="px-5 py-3 shrink-0">
                            <div class="join w-full shadow-sm">
                                <input type="text" placeholder="Add task..." class="input input-bordered join-item w-full focus:outline-none" id="inbox-input" autocomplete="off">
                                <button class="btn btn-primary join-item px-3" data-action="add-inbox"><i data-lucide="plus" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto px-5 pb-6 pt-2 custom-scroll relative bg-base-100" data-droppable="true" data-location="inbox">
                            ${inboxTasks.length ? inboxTasks.map(TaskItem).join('') : `
                                <div class="h-32 flex flex-col items-center justify-center border-2 border-dashed border-base-300 rounded-box mt-2 text-base-content/30 font-bold text-[10px] uppercase tracking-widest bg-base-200/50">Empty</div>
                            `}
                        </div>
                    </div>
                    <div class="flex flex-col h-2/5 bg-base-200/30">
                        <div class="p-5 pb-2">
                            <h3 class="font-bold text-base-content text-[11px] flex items-center gap-2.5">
                                <i data-lucide="sticky-note" class="w-3.5 h-3.5 text-warning"></i> Scratchpad
                            </h3>
                        </div>
                        <div class="px-5 pb-5 flex-1">
                            <textarea class="textarea textarea-bordered w-full h-full resize-none text-[13px] font-medium leading-relaxed bg-warning/5 border-warning/20 focus:border-warning/50 custom-scroll" id="notes-area" placeholder="Jot down ideas...">${state.notes}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function MatrixQuadrant(key) {
            const dynamicConfig = state.quadrants[key];
            const style = QUADRANT_STYLE[key];
            const tasks = state.tasks.filter(t => t.location === key && !t.completed);
            
            return `
                <div class="card bg-base-100 border border-base-300 shadow-sm flex flex-col h-full overflow-hidden group min-w-0 border-t-4 ${style.border} ${style.bg}">
                    <div class="px-4 py-3 border-b border-base-200 flex justify-between items-center bg-base-100/50 backdrop-blur-sm">
                        <div class="flex-1 mr-2 min-w-0">
                            <h3 class="font-bold text-xs text-base-content outline-none hover:bg-base-content/5 rounded px-1 -ml-1 transition-colors cursor-text truncate block" contenteditable="true" data-type="quadrant-title" data-key="${key}">${dynamicConfig.title}</h3>
                            <p class="text-[9px] font-bold uppercase tracking-[0.1em] mt-0.5 outline-none hover:bg-base-content/5 rounded px-1 -ml-1 transition-colors cursor-text block ${style.text}" contenteditable="true" data-type="quadrant-subtitle" data-key="${key}">${dynamicConfig.subtitle}</p>
                        </div>
                        <span class="badge badge-ghost badge-sm font-black text-base-content/60 shadow-sm shrink-0">${tasks.length}</span>
                    </div>
                    <div class="flex-1 p-3 overflow-y-auto custom-scroll relative group" data-droppable="true" data-location="${key}">
                        ${tasks.length ? tasks.map(TaskItem).join('') : `
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                <span class="text-[10px] text-base-content/20 font-black uppercase tracking-widest">Drop here</span>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function HistorySection() {
            const completedTasks = state.tasks.filter(t => t.completed);
            const completedList = [...completedTasks].sort((a, b) => b.completedAt - a.completedAt);
            return `
                <div class="h-32 bg-base-200 border-t border-base-300 flex flex-col shrink-0 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <div class="px-6 py-2 border-b border-base-300 flex items-center justify-between bg-base-300/50">
                        <h3 class="font-bold text-base-content/50 text-[10px] uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="archive" class="w-3 h-3"></i> Logged History
                        </h3>
                        ${completedTasks.length > 0 ? `<button class="btn btn-ghost btn-xs text-error font-black uppercase tracking-wider hover:bg-error/10" data-action="clear-completed">Clear History</button>` : ''}
                    </div>
                    <div class="flex-1 overflow-x-auto overflow-y-hidden p-4 flex items-center custom-scroll">
                        ${completedList.length ? completedList.map(CompletedTaskItem).join('') : '<div class="text-[10px] text-base-content/30 font-bold uppercase tracking-widest w-full text-center">No history recorded</div>'}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            const root = document.documentElement;
            root.setAttribute('data-theme', state.isDarkMode ? 'dark' : 'light');

            app.innerHTML = `
                ${state.showClearModal ? ClearHistoryModal() : ''}
                ${LeftPanel()}
                <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                    <div class="flex-1 p-5 overflow-hidden relative">
                        <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 24px 24px; color: oklch(var(--bc));"></div>
                        <div class="grid grid-cols-2 grid-rows-2 gap-5 h-full relative z-0">
                            ${MatrixQuadrant('q1')} ${MatrixQuadrant('q2')} ${MatrixQuadrant('q3')} ${MatrixQuadrant('q4')}
                        </div>
                    </div>
                    ${HistorySection()}
                </div>
            `;

            lucide.createIcons();
            document.getElementById('task-count').innerText = state.tasks.filter(t => !t.completed).length;
        }

        function setupEventListeners() {
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('button') || e.target.closest('[data-action]');
                if (!btn) return;
                const { action, id } = btn.dataset;

                if (action === 'complete') {
                    const idx = state.tasks.findIndex(t => t.id === id);
                    if (idx > -1) {
                        const newTasks = [...state.tasks];
                        newTasks[idx].completed = true;
                        newTasks[idx].completedAt = Date.now();
                        updateState({ tasks: newTasks });
                    }
                } else if (action === 'delete') {
                    updateState({ tasks: state.tasks.filter(t => t.id !== id) });
                } else if (action === 'restore') {
                    const idx = state.tasks.findIndex(t => t.id === id);
                    if (idx > -1) {
                        const newTasks = [...state.tasks];
                        newTasks[idx].completed = false;
                        newTasks[idx].completedAt = null;
                        updateState({ tasks: newTasks });
                    }
                } else if (action === 'clear-completed') {
                    updateState({ showClearModal: true });
                } else if (action === 'confirm-clear') {
                    updateState({ tasks: state.tasks.filter(t => !t.completed), showClearModal: false });
                } else if (action === 'cancel-clear') {
                    updateState({ showClearModal: false });
                } else if (action === 'add-inbox') {
                    addTaskFromInput();
                } else if (action === 'edit') {
                    state.editingId = state.editingId === id ? null : id;
                    state.datePickingId = null;
                    render();
                } else if (action === 'highlight') {
                    const idx = state.tasks.findIndex(t => t.id === id);
                    if (idx > -1) {
                        const newTasks = [...state.tasks];
                        newTasks[idx].isHighlighted = !newTasks[idx].isHighlighted;
                        updateState({ tasks: newTasks });
                    }
                } else if (action === 'toggle-date-picker') {
                    state.datePickingId = state.datePickingId === id ? null : id;
                    render();
                } else if (action === 'close-date') {
                    state.datePickingId = null;
                    render();
                } else if (action === 'export-json') {
                    exportToJSON();
                }
            });

            document.getElementById('theme-toggle').addEventListener('click', () => {
                updateState({ isDarkMode: !state.isDarkMode });
            });

            document.getElementById('import-input').addEventListener('change', (e) => {
                if (e.target.files.length) importFromJSON(e.target.files[0]);
            });

            document.addEventListener('input', (e) => {
                if (e.target.id === 'notes-area') {
                    state.notes = e.target.value;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.id === 'inbox-input' && e.key === 'Enter') addTaskFromInput();
                if (e.target.isContentEditable && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
            });

            document.addEventListener('focusout', (e) => {
                const el = e.target;
                if (!el.isContentEditable) return;
                const type = el.dataset.type;
                
                if (type === 'task-text') {
                    const text = el.innerText.trim();
                    const idx = state.tasks.findIndex(t => t.id === el.dataset.id);
                    if (idx > -1) {
                        const newTasks = [...state.tasks];
                        newTasks[idx].text = text || "New Task";
                        if (!(e.relatedTarget?.dataset.action === 'edit')) state.editingId = null;
                        updateState({ tasks: newTasks });
                    }
                } else if (type.includes('quadrant')) {
                    const key = el.dataset.key;
                    const prop = type === 'quadrant-title' ? 'title' : 'subtitle';
                    state.quadrants[key][prop] = el.innerText.trim();
                    updateState({ quadrants: { ...state.quadrants } });
                }
            });

            document.addEventListener('change', (e) => {
                if (e.target.dataset.type === 'task-due-date') {
                    const id = e.target.dataset.id;
                    const idx = state.tasks.findIndex(t => t.id === id);
                    if (idx > -1) {
                        const newTasks = [...state.tasks];
                        newTasks[idx].dueDate = e.target.value;
                        updateState({ tasks: newTasks });
                    }
                }
            });

            document.addEventListener('dragstart', (e) => {
                const taskEl = e.target.closest('[draggable="true"]');
                if (taskEl) {
                    state.draggedTaskId = taskEl.dataset.id;
                    taskEl.classList.add('dragging');
                }
            });
            document.addEventListener('dragend', (e) => {
                const taskEl = e.target.closest('[draggable="true"]');
                if (taskEl) taskEl.classList.remove('dragging');
                state.draggedTaskId = null;
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                const dropZone = e.target.closest('[data-droppable="true"]');
                if (dropZone) dropZone.classList.add('drag-over');
            });
            document.addEventListener('dragleave', (e) => {
                const dropZone = e.target.closest('[data-droppable="true"]');
                if (dropZone && !dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
            });
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                const dropZone = e.target.closest('[data-droppable="true"]');
                if (dropZone && state.draggedTaskId) {
                    const newLocation = dropZone.dataset.location;
                    const afterElement = getDragAfterElement(dropZone, e.clientY);
                    const draggedTask = state.tasks.find(t => t.id === state.draggedTaskId);
                    const otherTasks = state.tasks.filter(t => t.id !== state.draggedTaskId);
                    if (draggedTask) {
                        draggedTask.location = newLocation;
                        if (afterElement == null) otherTasks.push(draggedTask);
                        else {
                            const insertIndex = otherTasks.findIndex(t => t.id === afterElement.dataset.id);
                            otherTasks.splice(insertIndex, 0, draggedTask);
                        }
                        updateState({ tasks: otherTasks });
                    }
                }
            });
        }

        function addTaskFromInput() {
            const input = document.getElementById('inbox-input');
            const text = input.value.trim();
            if (!text) return;
            const newTask = { id: Date.now().toString(), text, location: 'inbox', completed: false, created: Date.now(), completedAt: null, isHighlighted: false, dueDate: null };
            updateState({ tasks: [...state.tasks, newTask] });
            input.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => { render(); setupEventListeners(); });
    </script>
</body>
</html>
