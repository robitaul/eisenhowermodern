<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix (Offline Edition)</title>
    <style>
        /* --- OFFLINE, ZERO-DEPENDENCY CSS --- */
        :root {
            /* Light Theme Variables */
            --bg-main: #f8fafc;
            --bg-panel: #ffffff;
            --bg-hover: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            
            /* Quadrant Colors */
            --q1-border: #ef4444; --q1-bg: #fef2f2;
            --q2-border: #0ea5e9; --q2-bg: #f0f9ff;
            --q3-border: #22c55e; --q3-bg: #f0fdf4;
            --q4-border: #9ca3af; --q4-bg: #f9fafb;
        }

        .dark {
            /* Dark Theme Variables */
            --bg-main: #020617;
            --bg-panel: #0f172a;
            --bg-hover: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --primary: #3b82f6;
            --primary-light: rgba(59, 130, 246, 0.1);
            
            --q1-bg: rgba(239, 68, 68, 0.05);
            --q2-bg: rgba(14, 165, 233, 0.05);
            --q3-bg: rgba(34, 197, 94, 0.05);
            --q4-bg: rgba(156, 163, 175, 0.05);
        }

        /* Base Resets */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-main); color: var(--text-main);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        button { background: none; border: none; cursor: pointer; color: inherit; font: inherit; }
        input, textarea { font: inherit; outline: none; }
        svg { width: 1.2rem; height: 1.2rem; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        /* Layout */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            z-index: 10; flex-shrink: 0;
        }
        .app-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .main-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .matrix-grid {
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 20px; padding: 20px; flex: 1; overflow: hidden;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px); background-size: 24px 24px;
        }
        .history-panel {
            height: 130px; background: var(--bg-panel); border-top: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0;
        }

        /* Components */
        .btn { padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn:hover { background: var(--bg-hover); }
        .btn-icon { padding: 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .badge { background: var(--bg-hover); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; border: 1px solid var(--border-color); }

        .input-group { display: flex; padding: 16px; border-bottom: 1px solid var(--border-color); }
        .input-group input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px 0 0 8px; background: var(--bg-main); color: var(--text-main); }
        .input-group button { padding: 0 16px; border-radius: 0 8px 8px 0; }

        .scratchpad { flex: 1; padding: 16px; display: flex; flex-direction: column; }
        .scratchpad textarea { flex: 1; resize: none; border: 1px solid var(--warning); border-radius: 8px; padding: 12px; background: rgba(234, 179, 8, 0.05); color: var(--text-muted); }

        .quadrant {
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-sm);
        }
        .quadrant-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); }
        .quadrant-title { font-size: 13px; font-weight: bold; }
        .quadrant-subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 4px; }
        .task-list { flex: 1; overflow-y: auto; padding: 12px; position: relative; }

        /* Task Cards */
        .task-card {
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px;
            padding: 10px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px;
            box-shadow: var(--shadow-sm); transition: 0.2s; position: relative;
        }
        .task-card:hover { border-color: var(--primary); }
        .task-card.highlighted { border-color: var(--warning); background: rgba(234, 179, 8, 0.05); }
        .task-card.editing { border: 2px solid var(--primary); }
        
        .task-content { flex: 1; min-width: 0; }
        .task-text { font-size: 13px; font-weight: 500; line-height: 1.4; word-break: break-word; outline: none; }
        .task-text[contenteditable="true"] { background: var(--bg-main); padding: 4px; border-radius: 4px; border: 1px solid var(--primary); }
        
        .task-actions { display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
        .task-card:hover .task-actions, .task-card.editing .task-actions { opacity: 1; }
        .task-actions .btn-icon { padding: 4px; color: var(--text-muted); }
        .task-actions .btn-icon:hover { color: var(--primary); }
        .task-actions .btn-icon.active { color: var(--warning); }
        .task-actions .btn-icon.danger:hover { color: var(--danger); }

        .drag-handle { color: var(--border-color); cursor: grab; padding-top: 2px; }
        .task-card:hover .drag-handle { color: var(--text-muted); }
        
        /* Drag and Drop states */
        .dragging { opacity: 0.5; cursor: grabbing !important; transform: scale(0.98); }
        .drag-over { background-color: var(--primary-light) !important; border: 2px dashed var(--primary) !important; }

        /* History */
        .history-header { padding: 8px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; background: var(--bg-main); font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .history-list { flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 24px; overflow-x: auto; }
        .history-card { border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; min-width: 200px; background: var(--bg-panel); }
        .history-card span { font-size: 12px; text-decoration: line-through; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: var(--primary); color: white; padding: 8px; border-radius: 8px;" id="icon-logo"></div>
            <div>
                <h1 style="font-size: 16px;">Eisenhower Matrix</h1>
                <div style="font-size: 10px; color: var(--text-muted); font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">Offline Edition</div>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button class="btn text-muted" data-action="export-json" id="icon-download">Export</button>
            <label class="btn text-muted" style="cursor: pointer;" id="icon-upload">
                Import <input type="file" id="import-input" accept=".json" class="hidden">
            </label>
            <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 8px;"></div>
            <button class="btn-icon" id="theme-toggle" title="Toggle Theme"></button>
            <div class="badge" style="margin-left: 8px;"><span id="task-count" style="color: var(--primary);">0</span> Tasks</div>
        </div>
    </header>

    <div class="app-container" id="app">
        </div>

    <script>
        // --- 1. HARCODED ICONS (No CDN needed) ---
        const ICONS = {
            grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>',
            download: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
            upload: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>',
            moon: '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>',
            sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>',
            plus: '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
            grip: '<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>',
            circle: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>',
            pencil: '<svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>',
            trash: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
            star: '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
            starFilled: '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
            checkCircle: '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
            restore: '<svg viewBox="0 0 24 24"><path d="M3 2v6h6"></path><path d="M3 13a9 9 0 1 0 3-7.7L3 8"></path></svg>'
        };

        // Static header icon injection
        document.getElementById('icon-logo').innerHTML = ICONS.grid;
        document.getElementById('icon-download').innerHTML = ICONS.download + ' Export';
        document.getElementById('icon-upload').innerHTML = ICONS.upload + ' Import <input type="file" id="import-input" accept=".json" class="hidden">';

        // --- 2. STATE MANAGEMENT ---
        const STORAGE_KEY = 'eisenhower_matrix_offline';
        const defaultState = {
            tasks: [
                { id: '1', text: 'Review quarterly goals', location: 'q1', completed: false, isHighlighted: true },
                { id: '2', text: 'Sync with engineering team', location: 'inbox', completed: false, isHighlighted: false },
            ],
            notes: "Quick offline scratchpad...",
            quadrants: {
                q1: { title: 'Do First', subtitle: 'Urgent & Important' },
                q2: { title: 'Schedule', subtitle: 'Not Urgent & Important' },
                q3: { title: 'Delegate', subtitle: 'Urgent & Not Important' },
                q4: { title: 'Don\'t Do', subtitle: 'Not Urgent & Not Important' }
            },
            isDarkMode: false, draggedTaskId: null, editingId: null
        };

        const state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;
        state.draggedTaskId = null; state.editingId = null;

        function updateState(updates) {
            Object.assign(state, updates);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render();
        }

        // --- 3. COMPONENTS ---
        function TaskItem(task) {
            const isEditing = state.editingId === task.id;
            return `
                <div class="task-card ${task.isHighlighted ? 'highlighted' : ''} ${isEditing ? 'editing' : ''}" draggable="${!isEditing}" data-id="${task.id}">
                    <div class="drag-handle">${ICONS.grip}</div>
                    <button class="btn-icon" style="color: var(--border-color);" data-action="complete" data-id="${task.id}">${ICONS.circle}</button>
                    <div class="task-content">
                        <div class="task-text" contenteditable="${isEditing}" data-type="task-text" data-id="${task.id}">${task.text}</div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon ${task.isHighlighted ? 'active' : ''}" data-action="highlight" data-id="${task.id}">${task.isHighlighted ? ICONS.starFilled : ICONS.star}</button>
                        <button class="btn-icon" data-action="edit" data-id="${task.id}">${isEditing ? ICONS.check : ICONS.pencil}</button>
                        ${!isEditing ? `<button class="btn-icon danger" data-action="delete" data-id="${task.id}">${ICONS.trash}</button>` : ''}
                    </div>
                </div>
            `;
        }

        function render() {
            if (state.isDarkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            document.getElementById('theme-toggle').innerHTML = state.isDarkMode ? ICONS.sun : ICONS.moon;
            document.getElementById('task-count').innerText = state.tasks.filter(t => !t.completed).length;

            const inboxTasks = state.tasks.filter(t => t.location === 'inbox' && !t.completed);
            const historyTasks = state.tasks.filter(t => t.completed);

            document.getElementById('app').innerHTML = `
                <div class="sidebar">
                    <div style="padding: 20px; border-bottom: 1px solid var(--border-color);">
                        <h2 style="display:flex; justify-content:space-between; margin-bottom: 12px;">Inbox <span class="badge">${inboxTasks.length}</span></h2>
                        <div class="input-group" style="padding:0; border:none;">
                            <input type="text" id="inbox-input" placeholder="Add task..." autocomplete="off">
                            <button class="btn-primary" data-action="add-inbox">${ICONS.plus}</button>
                        </div>
                    </div>
                    <div class="task-list" data-droppable="true" data-location="inbox">
                        ${inboxTasks.map(TaskItem).join('')}
                    </div>
                    <div class="scratchpad border-t">
                        <h3 style="font-size: 12px; margin-bottom: 8px; color: var(--text-muted);">Scratchpad</h3>
                        <textarea id="notes-area">${state.notes}</textarea>
                    </div>
                </div>

                <div class="main-content">
                    <div class="matrix-grid">
                        ${['q1', 'q2', 'q3', 'q4'].map(q => `
                            <div class="quadrant" style="border-top: 4px solid var(--${q}-border); background: var(--${q}-bg);">
                                <div class="quadrant-header">
                                    <div>
                                        <div class="quadrant-title" contenteditable="true" data-type="q-title" data-key="${q}">${state.quadrants[q].title}</div>
                                        <div class="quadrant-subtitle" contenteditable="true" data-type="q-sub" data-key="${q}">${state.quadrants[q].subtitle}</div>
                                    </div>
                                    <div class="badge">${state.tasks.filter(t => t.location === q && !t.completed).length}</div>
                                </div>
                                <div class="task-list" data-droppable="true" data-location="${q}">
                                    ${state.tasks.filter(t => t.location === q && !t.completed).map(TaskItem).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="history-panel">
                        <div class="history-header">
                            <div>Logged History</div>
                            ${historyTasks.length > 0 ? `<button data-action="clear-history" style="color: var(--danger); cursor: pointer;">Clear</button>` : ''}
                        </div>
                        <div class="history-list">
                            ${historyTasks.map(t => `
                                <div class="history-card">
                                    <div style="color: var(--success);">${ICONS.checkCircle}</div>
                                    <span>${t.text}</span>
                                    <button class="btn-icon" data-action="restore" data-id="${t.id}">${ICONS.restore}</button>
                                </div>
                            `).join('') || '<div style="color: var(--text-muted); font-size:12px;">No history recorded</div>'}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 4. EVENT LISTENERS ---
        document.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn || !btn.dataset.action) return;
            const { action, id } = btn.dataset;

            if (action === 'complete') updateState({ tasks: state.tasks.map(t => t.id === id ? { ...t, completed: true } : t) });
            else if (action === 'delete') updateState({ tasks: state.tasks.filter(t => t.id !== id) });
            else if (action === 'restore') updateState({ tasks: state.tasks.map(t => t.id === id ? { ...t, completed: false } : t) });
            else if (action === 'highlight') updateState({ tasks: state.tasks.map(t => t.id === id ? { ...t, isHighlighted: !t.isHighlighted } : t) });
            else if (action === 'clear-history') updateState({ tasks: state.tasks.filter(t => !t.completed) });
            else if (action === 'add-inbox') {
                const input = document.getElementById('inbox-input');
                if (input.value.trim()) {
                    updateState({ tasks: [...state.tasks, { id: Date.now().toString(), text: input.value.trim(), location: 'inbox', completed: false }] });
                }
            }
            else if (action === 'edit') {
                state.editingId = state.editingId === id ? null : id;
                render();
            }
        });

        document.getElementById('theme-toggle').addEventListener('click', () => updateState({ isDarkMode: !state.isDarkMode }));

        // Text Editing
        document.addEventListener('focusout', e => {
            if (!e.target.isContentEditable) return;
            const el = e.target;
            const type = el.dataset.type;
            
            if (type === 'task-text') {
                updateState({ tasks: state.tasks.map(t => t.id === el.dataset.id ? { ...t, text: el.innerText.trim() } : t), editingId: null });
            } else if (type === 'q-title' || type === 'q-sub') {
                state.quadrants[el.dataset.key][type === 'q-title' ? 'title' : 'subtitle'] = el.innerText.trim();
                updateState({ quadrants: state.quadrants });
            }
        });

        document.addEventListener('input', e => {
            if (e.target.id === 'notes-area') {
                state.notes = e.target.value;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            }
        });

        document.addEventListener('keydown', e => {
            if (e.target.id === 'inbox-input' && e.key === 'Enter') document.querySelector('[data-action="add-inbox"]').click();
            if (e.target.isContentEditable && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        });

        // Drag and Drop
        document.addEventListener('dragstart', e => {
            const card = e.target.closest('.task-card');
            if (card) { state.draggedTaskId = card.dataset.id; card.classList.add('dragging'); }
        });
        document.addEventListener('dragend', e => {
            const card = e.target.closest('.task-card');
            if (card) card.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            state.draggedTaskId = null;
        });
        document.addEventListener('dragover', e => {
            e.preventDefault();
            const zone = e.target.closest('[data-droppable="true"]');
            if (zone) zone.classList.add('drag-over');
        });
        document.addEventListener('dragleave', e => {
            const zone = e.target.closest('[data-droppable="true"]');
            if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
        });
        document.addEventListener('drop', e => {
            e.preventDefault();
            const zone = e.target.closest('[data-droppable="true"]');
            if (zone && state.draggedTaskId) {
                const task = state.tasks.find(t => t.id === state.draggedTaskId);
                if (task) {
                    task.location = zone.dataset.location;
                    updateState({ tasks: state.tasks });
                }
            }
        });

        // Export/Import
        document.addEventListener('click', e => {
            if (e.target.closest('#icon-download')) {
                const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'eisenhower-backup.json';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
        });
        
        document.addEventListener('change', e => {
            if (e.target.id === 'import-input' && e.target.files.length) {
                const reader = new FileReader();
                reader.onload = ev => { try { updateState(JSON.parse(ev.target.result)); } catch (err) { alert('Invalid file'); } };
                reader.readAsText(e.target.files[0]);
            }
        });

        render();
    </script>
</body>
</html>
